name: Testing APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
      - 'testing/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-testing-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-testing-

      - name: Generate aboutlibraries.json
        run: ./gradlew :app:prepareLibraryDefinitionsTestingDebug --rerun

      - name: Build testing APK
        run: ./gradlew assembleTestingDebug

      - name: Upload testing APK
        uses: actions/upload-artifact@v7
        with:
          name: testing-apk-${{ github.sha }}
          path: app/build/outputs/apk/testing/debug/*.apk
